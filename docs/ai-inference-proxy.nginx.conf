# yz.gamehost.dev için örnek ters proxy yapılandırması.
# __AI_PROXY_TOKEN__, sertifika yolları ve upstream adresi deployment sırasında değiştirilmelidir.
limit_req_zone $binary_remote_addr zone=ai_per_ip:10m rate=2r/s;

map $http_authorization $ai_authorized {
  default 0;
  "Bearer __AI_PROXY_TOKEN__" 1;
}

server {
  listen 443 ssl http2;
  server_name yz.gamehost.dev;

  ssl_certificate     /etc/letsencrypt/live/yz.gamehost.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yz.gamehost.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 64k;
  proxy_connect_timeout 10s;
  # Yerel modelin uzun inference süresine izin verir; uygulama 210 sn'de isteği keser.
  proxy_read_timeout 230s;
  proxy_send_timeout 30s;

  location = /v1/models { return 404; }
  location / { return 404; }

  location = /v1/chat/completions {
    if ($ai_authorized = 0) { return 401; }
    limit_req zone=ai_per_ip burst=4 nodelay;

    proxy_pass http://127.0.0.1:8000/v1/chat/completions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;

    # Nginx erişim logu gövdeyi içermez. Upstream SGLang/vLLM tarafında prompt/response
    # logging ve request-body capture ayrıca kapatılmalıdır.
  }
}
